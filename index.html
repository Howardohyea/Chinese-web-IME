<div id="body"><script language="javascript" src="IME-files/data-utf.js"></script>
<script language="javascript" src="IME-files/ime.js"></script>

<form id="ime">

 <textarea onkeydown="return ImeKeyDown(event)" onkeypress="return ImeKeyPress(event)" onkeyup="return ImeKeyUp(event)" rows="13" cols="60" style="width:460px; height:280px; font-size: 12pt; font-family: simsun,mssong,mingliu,arial" id="InputArea"></textarea>
